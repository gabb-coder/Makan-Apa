body{margin:0}

@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

@keyframes glow{0%,100%{box-shadow:0 8px 18px rgba(204,63,23,.3)}50%{box-shadow:0 8px 30px rgba(204,63,23,.6)}}
@keyframes wiggleLoop{0%,14%,100%{transform:rotate(0)}3%{transform:rotate(-14deg)}7%{transform:rotate(11deg)}11%{transform:rotate(-5deg)}}
.press{transition:transform .15s ease}.press:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  _clear() {
    (this._timers || []).forEach((t) => clearTimeout(t));
    this._timers = [];
  }
  componentWillUnmount() {
    this._clear();
  }
  renderVals() {
    const foods = [
      { name: 'Nasi Lemak', icon: 'rice', bg: '#DDEFD8', fg: '#2F6B2A' },
      { name: 'Ramen', icon: 'bowl', bg: '#FFF0C2', fg: '#8A5A00' },
      { name: 'Chicken Rice', icon: 'rice', bg: '#FDE3CF', fg: '#9A4A12' },
      { name: 'Pizza', icon: 'pizza', bg: '#FDDAD0', fg: '#A8330F' },
      { name: 'Mixed Rice', icon: 'rice', bg: '#DCEAFB', fg: '#1F5596' },
      { name: 'Sushi', icon: 'sushi', bg: '#F1E1F5', fg: '#7A3483' },
      { name: 'Burger', icon: 'burger', bg: '#F5E6D0', fg: '#7A5222' },
      { name: 'Mamak', icon: 'cup', bg: '#D6F0EB', fg: '#1E6B62' }
    ];
    const s = this.state || {};
    const rot = s.rot || 0;
    const spinning = !!s.spinning;
    const hasPick = typeof s.pick === 'number';
    const f = foods[hasPick ? s.pick : 0];
    const spin = () => {
      const cur = this.state || {};
      if (cur.spinning) return;
      const k = Math.floor(Math.random() * foods.length);
      const target = (360 - (45 * k + 22.5)) % 360;
      const from = cur.rot || 0;
      const next = from - (from % 360) + 360 * 6 + target + (Math.random() * 24 - 12);
      this._clear();
      this.setState({ rot: next, spinning: true, pick: null, tick: 'fast' });
      this._timers = [
        setTimeout(() => this.setState({ tick: 'mid' }), 1500),
        setTimeout(() => this.setState({ tick: 'slow' }), 2700),
        setTimeout(() => this.setState({ tick: 'crawl' }), 3500),
        setTimeout(() => this.setState({ spinning: false, pick: k, tick: '' }), 4300)
      ];
    };
    return {
      rot: rot,
      spinning: spinning,
      hasResult: hasPick && !spinning,
      noResult: !hasPick || spinning,
      spin: spin,
      spinLabel: spinning ? 'Spinning…' : 'SPIN',
      pointerAnim: ({ fast: 'tick 0.09s linear infinite', mid: 'tick 0.15s linear infinite', slow: 'tick 0.26s linear infinite', crawl: 'tick 0.42s linear infinite' })[s.tick] || 'none',
      swayAnim: !spinning && !hasPick ? 'sway 3.2s ease-in-out infinite' : 'none',
      res: {
        name: f.name,
        bg: f.bg,
        fg: f.fg,
        isRice: f.icon === 'rice',
        isBowl: f.icon === 'bowl',
        isPizza: f.icon === 'pizza',
        isSushi: f.icon === 'sushi',
        isBurger: f.icon === 'burger',
        isCup: f.icon === 'cup'
      }
    };
  }
}
</script>

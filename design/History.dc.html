<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#CC3F17}a:hover{color:#A8330F}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}30%{transform:scale(1.12,.94) rotate(3deg)}60%{transform:scale(.95,1.1) rotate(-2deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F4; color: #18181B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 16px; overflow: hidden">

    <header style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #66666D">Room K7M2QX</span>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">History</h1>
      </div>
      <button type="button" aria-label="Change month, showing October" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E6E6E2; background: #FFFFFF; color: #18181B; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
        October
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; animation: fadeUp 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both">
      <div style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; color: #66666D">Meals</span>
        <span style="font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">{{meals}}</span>
        <span style="font-size: 12px; color: #66666D">this month</span>
      </div>
      <div style="background: #FFF0C2; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6B4600"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="transform-origin: 50% 90%; animation: flicker 1.1s ease-in-out infinite"><path d="M12 2c.5 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.8 1.6-4.4 2.8-5.6.2 2.1 1.2 3.4 2.4 3.6-.6-3.2-.8-6 0-9z" fill="#CC3F17"></path></svg>No repeats</span>
        <span style="font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: #4A3000">{{streak}} days</span>
        <span style="font-size: 12px; color: #6B4600">best streak</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; color: #66666D">Vetoes</span>
        <span style="font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">{{vetoes}}</span>
        <span style="font-size: 12px; color: #66666D">You 2 · Alex 3</span>
      </div>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; animation: fadeUp 0.55s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 800">Who decided</span>
        <span style="font-size: 12px; color: #66666D">29 days</span>
      </div>
      <div role="img" aria-label="You decided 15 days, Alex decided 14 days" style="display: flex; gap: 4px; height: 12px">
        <div style="flex: 15; border-radius: 999px; background: #CC3F17; transform-origin: left; animation: growX 0.9s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div>
        <div style="flex: 14; border-radius: 999px; background: #2F6FD6; transform-origin: right; animation: growX 0.9s 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
        <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #CC3F17"></span>You · 15</span>
        <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #2F6FD6"></span>Alex · 14</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; animation: fadeUp 0.55s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both">
      <span style="font-size: 15px; font-weight: 800">Most eaten</span>
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 24px; align-items: center; column-gap: 10px; row-gap: 8px; font-size: 13px">
        <span style="font-weight: 600">Nasi Lemak</span>
        <div style="height: 14px; border-radius: 999px; background: #F1F1ED"><div style="width: 100%; height: 14px; border-radius: 999px; background: #A8D8A0; transform-origin: left; animation: growX 1s 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div></div>
        <span style="font-weight: 800; text-align: right">5</span>
        <span style="font-weight: 600">Chicken Rice</span>
        <div style="height: 14px; border-radius: 999px; background: #F1F1ED"><div style="width: 80%; height: 14px; border-radius: 999px; background: #F6C59A; transform-origin: left; animation: growX 1s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div></div>
        <span style="font-weight: 800; text-align: right">4</span>
        <span style="font-weight: 600">Ramen</span>
        <div style="height: 14px; border-radius: 999px; background: #F1F1ED"><div style="width: 80%; height: 14px; border-radius: 999px; background: #FFD966; transform-origin: left; animation: growX 1s 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div></div>
        <span style="font-weight: 800; text-align: right">4</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #66666D">Recent meals</span>
      <div style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 18px; display: flex; flex-direction: column">
        <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: {{e.divider}}; animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: {{e.delay}}">
            <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{e.bg}}; color: {{e.fg}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{e.isRice}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14a7 7 0 0 1 14 0"></path><path d="M2.5 14h19"></path><path d="M5 17.5h14"></path><path d="M10 8.5v.01M13 10v.01M9 11.5v.01"></path></svg></sc-if>
              <sc-if value="{{e.isBowl}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M9 20h6"></path><path d="M13 3l-3 8M18 4l-5 7"></path></svg></sc-if>
            </div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 15px; font-weight: 700">{{e.food}}</span>
              <span style="font-size: 12px; color: #66666D">{{e.meta}}</span>
            </div>
            <sc-if value="{{e.vetoed}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; padding: 3px 8px; border-radius: 999px; background: #F1F1ED; color: #4A4A50; font-size: 11px; font-weight: 700">{{e.veto}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="height: 76px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E6E6E2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #66666D; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      Today
    </a>
    <a href="Wheel.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #66666D; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8"></path></svg>
      Wheel
    </a>
    <a href="Pool.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #66666D; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
      Food list
    </a>
    <a href="History.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #CC3F17; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      History
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 1100);
      this.setState({ p: 1 - Math.pow(1 - t, 3) });
      if (t < 1) this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }
  renderVals() {
    const s = this.state || {};
    const p = typeof s.p === 'number' ? s.p : 1;
    const rows = [
      { food: 'Chicken Rice', meta: 'Thu 29 · Alex picked', veto: '', icon: 'rice', bg: '#FDE3CF', fg: '#9A4A12' },
      { food: 'Ramen', meta: 'Wed 28 · You, by wheel', veto: 'Pizza vetoed', icon: 'bowl', bg: '#FFF0C2', fg: '#8A5A00' },
      { food: 'Mixed Rice', meta: 'Tue 27 · Alex picked', veto: '', icon: 'rice', bg: '#DCEAFB', fg: '#1F5596' }
    ];
    return {
      meals: Math.round(29 * p),
      streak: Math.round(6 * p),
      vetoes: Math.round(5 * p),
      entries: rows.map((r, i) => ({
        delay: (0.5 + i * 0.1).toFixed(2) + 's',
        food: r.food,
        meta: r.meta,
        veto: r.veto,
        vetoed: !!r.veto,
        bg: r.bg,
        fg: r.fg,
        isRice: r.icon === 'rice',
        isBowl: r.icon === 'bowl',
        divider: i < rows.length - 1 ? '1px solid #EFEFEB' : 'none'
      }))
    };
  }
}
</script>
</body>
</html>
